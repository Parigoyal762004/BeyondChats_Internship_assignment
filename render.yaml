services:
  - type: web
    name: beyondchats-backend
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        fromDatabase:
          name: beyondchats
          property: connectionString
      - key: GEMINI_API_KEY
        sync: false
      - key: SERPAPI_API_KEY
        sync: false

databases:
  - name: beyondchats
    databaseName: postgres
    user: postgres
    plan: free
